<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Study Ladder</title>
<meta name="description" content="Learn any subject from the basics through exam-style questions, with AI marking and coaching.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'%3E%3Cpath d='M5 2v18M17 2v18M5 6h12M5 11h12' stroke='%2315233a' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M5 16h12' stroke='%23f3cf3e' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a single study column on squared exercise-book paper; the path is a ladder of rungs, lessons are one question card at a time. */
:root{
  --paper:#eef2f1; --grid:rgba(30,60,80,.06); --card:#ffffff; --ink:#15233a; --ink-2:#4b5a6e; --line:#d5dde0;
  --mark:#f3cf3e; --mark-ink:#3d3000; --accent:#1f5f8b; --accent-soft:#e1edf5;
  --good:#1d7a52; --good-soft:#e2f3ea; --warn:#a2610a; --warn-soft:#fbefd9; --bad:#b23a3a; --bad-soft:#f8e3e1; --ai:#6a4fb0; --ai-soft:#eee9f9;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111821; --grid:rgba(160,200,230,.05); --card:#18222e; --ink:#e6edf3; --ink-2:#9fb0c2; --line:#2b3947;
  --mark:#e8c53a; --mark-ink:#241c00; --accent:#7cb8e4; --accent-soft:#1d3346;
  --good:#5fcf98; --good-soft:#163428; --warn:#e7aa52; --warn-soft:#3a2b14; --bad:#f08a84; --bad-soft:#3d1f1e; --ai:#b8a3f0; --ai-soft:#2a2340; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111821; --grid:rgba(160,200,230,.05); --card:#18222e; --ink:#e6edf3; --ink-2:#9fb0c2; --line:#2b3947;
  --mark:#e8c53a; --mark-ink:#241c00; --accent:#7cb8e4; --accent-soft:#1d3346;
  --good:#5fcf98; --good-soft:#163428; --warn:#e7aa52; --warn-soft:#3a2b14; --bad:#f08a84; --bad-soft:#3d1f1e; --ai:#b8a3f0; --ai-soft:#2a2340; color-scheme:dark}
html,body{min-height:100%}
body{background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:flex;flex-direction:column;gap:18px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
header.top .in{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;cursor:pointer;background:none;border:0;color:var(--ink);padding:0}
.brand svg{flex:none}
.crumb{color:var(--ink-2);font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.store{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;max-width:38vw;overflow:hidden;text-overflow:ellipsis}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(26px,5vw,34px);font-weight:800;letter-spacing:-.02em}
h2{font-size:21px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--card);padding:9px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink-2)}
.btn.mark{background:var(--mark);border-color:var(--mark);color:var(--mark-ink)}
.btn.small{font-size:13.5px;padding:6px 11px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.rung:focus-visible,.tab:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14.5px}
label.f .muted{font-weight:400}
input[type=text],textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;box-sizing:border-box}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{display:flex;gap:8px;align-items:flex-start;border:1.5px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:400;flex:1 1 180px}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg input{margin-top:4px;accent-color:var(--accent)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;cursor:pointer;background:var(--paper)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.files{display:flex;flex-direction:column;gap:6px}
.file{display:flex;gap:10px;align-items:center;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--card);min-width:0}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.mcq{color:var(--accent);border-color:currentColor}
.chip.saq{color:var(--good);border-color:currentColor}
.chip.essay{color:var(--warn);border-color:currentColor}
.chip.ai{color:var(--ai);border-color:currentColor;background:var(--ai-soft)}
.chip.ex{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.marks{font-family:var(--f-mono);font-size:13px;font-weight:600;white-space:nowrap}
.log{font-family:var(--f-mono);font-size:13px;display:flex;flex-direction:column;gap:4px}
.log .ok{color:var(--good)} .log .err{color:var(--bad)}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.course{cursor:pointer;text-align:left;font:inherit;color:inherit}
.course:hover{border-color:var(--ink-2)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{font:inherit;font-weight:700;font-size:14.5px;background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--mark)}
/* ladder */
.unit{display:flex;flex-direction:column;gap:8px}
.unit-h{display:flex;gap:10px;align-items:baseline}
.unit-h .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-2)}
.ladder{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--line);margin-left:9px;padding-left:16px}
.rung{position:relative;display:flex;gap:12px;align-items:center;text-align:left;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;min-width:0}
.rung:hover{border-color:var(--ink-2)}
.rung::before{content:"";position:absolute;left:-24px;top:50%;width:13px;height:13px;margin-top:-7.5px;border-radius:50%;background:var(--paper);border:3px solid var(--line)}
.rung.done::before{background:var(--good);border-color:var(--good)}
.rung.shaky::before{background:var(--warn);border-color:var(--warn)}
.rung.next{border-color:var(--ink);box-shadow:3px 3px 0 var(--mark)}
.rung.next::before{border-color:var(--ink)}
.rung.skip::before{background:var(--accent);border-color:var(--accent)}
.rung .t{flex:1;min-width:0}
.rung .t b{display:block}
.rung .pct{font-family:var(--f-mono);font-size:13px;font-weight:600}
/* lesson */
.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--ink)} .progress i.good{background:var(--good)} .progress i.part{background:var(--warn)} .progress i.bad{background:var(--bad)}
.learn{background:var(--accent-soft);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.learn .eyebrow{color:var(--accent)}
.prose{display:flex;flex-direction:column;gap:8px}
.prose ul{margin:0;padding-left:20px}
.prose code{font-family:var(--f-mono);font-size:.92em;background:var(--paper);padding:1px 4px;border-radius:4px}
.prose mark{background:var(--mark);color:var(--mark-ink);padding:0 3px;border-radius:3px}
.q{font-size:17.5px;font-weight:700;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.opt .k{font-family:var(--f-mono);font-weight:600;width:22px;height:22px;flex:none;border-radius:5px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:12px}
.opt[aria-pressed=true]{border-color:var(--ink)} .opt[aria-pressed=true] .k{background:var(--ink);color:var(--card);border-color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt .why{display:block;font-size:14px;color:var(--ink-2);margin-top:4px}
.opt:disabled{cursor:default}
.fb{border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:1.5px solid}
.fb.correct{background:var(--good-soft);border-color:var(--good)} .fb.partial{background:var(--warn-soft);border-color:var(--warn)} .fb.incorrect{background:var(--bad-soft);border-color:var(--bad)}
.fb h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.fb ul{margin:0;padding-left:20px}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:700;font-size:14.5px}
.note{font-size:14px;border-left:3px solid var(--ai);padding:4px 10px;background:var(--ai-soft);border-radius:0 6px 6px 0}
.err{color:var(--bad);font-size:14.5px}
.empty{text-align:center;padding:28px 18px;color:var(--ink-2)}
.score-big{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end}
@media (max-width:560px){.hero{grid-template-columns:1fr}}
.steps-art{display:flex;flex-direction:column-reverse;gap:5px;width:120px}
.steps-art i{display:block;height:9px;border-radius:2px;background:var(--line)}
.steps-art i:nth-child(1){width:30%;background:var(--good)} .steps-art i:nth-child(2){width:48%;background:var(--good)} .steps-art i:nth-child(3){width:66%;background:var(--mark)} .steps-art i:nth-child(4){width:84%} .steps-art i:nth-child(5){width:100%}
@media (max-width:560px){.steps-art{display:none}}
</style>
</head>
<body>
<header class="top"><div class="in">
  <button class="brand" id="homeBtn" aria-label="Study Ladder home">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><path d="M5 2v18M17 2v18M5 6h12M5 11h12M5 16h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/><path d="M5 16h12" stroke="var(--mark)" stroke-width="2.4" stroke-linecap="round"/></svg>
    Study Ladder
  </button>
  <span class="crumb" id="crumb"></span>
  <span class="store" id="storeBadge"></span>
  <button class="link small" id="signOut" hidden>Sign out</button>
</div></header>
<main class="wrap" id="app" aria-live="polite">
  <div class="card empty"><span class="spin"></span> Loading your courses…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
/* ============ tiny helpers ============ */
const $ = (s, el = document) => el.querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : String(kid));
  return el;
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/==(.+?)==/g, '<mark>$1</mark>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<i>$2</i>').replace(/`([^`]+)`/g, '<code>$1</code>');
}
function md(s) {
  const out = []; let list = null;
  for (const raw of String(s ?? '').split(/\n/)) {
    const line = raw.trim();
    const m = line.match(/^([-*•]|\d+[.)])\s+(.*)/);
    if (m) { if (!list) { list = []; } list.push(`<li>${inline(m[2])}</li>`); continue; }
    if (list) { out.push(`<ul>${list.join('')}</ul>`); list = null; }
    if (line) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push(`<ul>${list.join('')}</ul>`);
  return h('div', { class: 'prose', html: out.join('') });
}
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const typeName = { mcq: 'MCQ', saq: 'Short answer', essay: 'Essay' };

/* ============ storage: each student's private rows in Supabase (row-level security) ============ */
let sb = null;
function dbErr(e) { console.error(e); return new Error('Could not save or load your work. Check your connection and try again.'); }
const Store = {
  uid: null, name: '', isAdmin: false,
  async init(user) {
    this.uid = user.id;
    const m = user.user_metadata || {};
    this.name = (m.full_name || m.name || (user.email || '').split('@')[0] || 'Student').slice(0, 80);
    try { const { data } = await sb.rpc('is_admin'); this.isAdmin = !!data; } catch {}
  },
  async put(col, id, obj) {
    const { error } = await sb.from('docs').upsert({ owner: this.uid, col, id, data: JSON.parse(JSON.stringify(obj)), updated_at: new Date().toISOString() });
    if (error) throw dbErr(error);
  },
  async get(col, id) {
    const { data, error } = await sb.from('docs').select('data').eq('col', col).eq('id', id).maybeSingle();
    if (error) throw dbErr(error);
    return data?.data ?? null;
  },
  async list(col, field, value) {
    let q = sb.from('docs').select('id,data').eq('col', col);
    if (field) q = q.eq('data->>' + field, value);
    const { data, error } = await q;
    if (error) throw dbErr(error);
    return data.map(r => ({ ...r.data, id: r.id }));
  },
  async del(col, id) {
    const { error } = await sb.from('docs').delete().eq('col', col).eq('id', id);
    if (error) throw dbErr(error);
  }
};

/* ============ Claude ============ */
const imgLimits = { maxCount: 4 };
const TUTOR = `You are the tutor inside Study Ladder, an app where students learn a subject by working through exam-style questions in a careful teaching order.
Treat the student as a complete beginner unless told otherwise: define every term the first time it appears, use plain language and everyday examples, and build each idea only on ideas already taught.
Be accurate. Never invent facts, figures, quotes or mark schemes you are unsure of; prefer standard textbook content. Write in the same language as the student's course materials (English if unclear).`;

class AIError extends Error {}
// Photos are shrunk to JPEG so several fit in one request.
async function toJpeg(blob) {
  const bmp = await createImageBitmap(blob);
  const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const out = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.82));
  const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(out); });
  return { media_type: 'image/jpeg', data: b64 };
}
async function encodeImages(blobs) {
  try { return await Promise.all(blobs.slice(0, imgLimits.maxCount).map(toJpeg)); }
  catch { throw new AIError('One of the images could not be read. Try a JPEG or PNG photo.'); }
}
async function callAI(payload) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new AIError('Your sign-in has expired. Sign in again.');
  let r;
  try { r = await fetch('/api/ai', { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + session.access_token }, body: JSON.stringify(payload) }); }
  catch { throw new AIError('Could not reach Study Ladder. Check your internet connection and try again.'); }
  let j = {}; try { j = await r.json(); } catch {}
  if (!r.ok) { const e = new AIError(j.error || 'The AI tutor had a problem. Try again.'); e.code = j.code || 'http_' + r.status; throw e; }
  return j;
}
async function askJSON(prompt, { tier = 'default', images, kind = 'other' } = {}) {
  const imgs = images?.length ? await encodeImages(images) : [];
  for (let attempt = 0; ; attempt++) {
    try { return (await callAI({ prompt, tier, kind, json: true, images: imgs })).value; }
    catch (e) { if (e.code === 'invalid_json' && attempt === 0) continue; throw e; }
  }
}
async function askText(prompt, { tier = 'default', images, kind = 'other' } = {}) {
  const imgs = images?.length ? await encodeImages(images) : [];
  return (await callAI({ prompt, tier, kind, json: false, images: imgs })).text;
}

/* ============ file reading ============ */
const libs = {};
function loadScript(src) {
  return libs[src] ??= new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Could not load a reader for this file type.')); document.head.append(s); });
}
const CDN = 'https://cdn.jsdelivr.net/npm/';
async function pdfLib() {
  await loadScript(CDN + 'pdfjs-dist@3.11.174/build/pdf.worker.min.js'); // main-thread worker (no cross-origin Worker needed)
  await loadScript(CDN + 'pdfjs-dist@3.11.174/build/pdf.min.js');
  return window.pdfjsLib;
}
async function blobsToText(blobs, name, log) {
  const max = imgLimits.maxCount;
  let text = '';
  for (let i = 0; i < blobs.length; i += max) {
    log?.(`Reading ${name}: images ${i + 1}–${Math.min(i + max, blobs.length)} of ${blobs.length}`);
    text += '\n' + await askText(`Transcribe every piece of text in these images of study material (${name}) faithfully, in reading order. Keep headings and bullet points. Describe each diagram, graph or table in one or two lines as [Diagram: ...]. Write equations in plain text. Output the transcription only.`, { images: blobs.slice(i, i + max), kind: 'other' });
  }

}
async function readFile(file, log) {
  const name = file.name, ext = name.split('.').pop().toLowerCase(), buf = () => file.arrayBuffer();
  if (['txt', 'md', 'csv', 'tex', 'html', 'htm', 'rtf'].includes(ext) || file.type.startsWith('text/')) {
    let t = await file.text(); if (/^html?$/.test(ext)) t = new DOMParser().parseFromString(t, 'text/html').body.innerText; return t;
  }
  if (ext === 'pdf') {
    const pdfjs = await pdfLib();
    const doc = await pdfjs.getDocument({ data: new Uint8Array(await buf()) }).promise;
    let out = [];
    for (let p = 1; p <= doc.numPages; p++) {
      if (p % 20 === 1) log?.(`Reading ${name}: page ${p} of ${doc.numPages}`);
      const page = await doc.getPage(p); const tc = await page.getTextContent();
      let line = '', lastY = null; const lines = [];
      for (const it of tc.items) { const y = it.transform?.[5]; if (lastY !== null && Math.abs(y - lastY) > 2) { lines.push(line); line = ''; } line += it.str; lastY = y; }
      lines.push(line); out.push(`[Page ${p}]\n` + lines.join('\n'));
    }
    const text = out.join('\n\n');
    if (text.replace(/\[Page \d+\]|\s/g, '').length < 40 * doc.numPages * 0.3) {
      // looks scanned: render pages and let Claude read them
      const pages = Math.min(doc.numPages, 30), blobs = [];
      log?.(`${name} looks scanned. Rendering ${pages} page${pages > 1 ? 's' : ''} for Claude to read…`);
      for (let p = 1; p <= pages; p++) {
        const page = await doc.getPage(p), vp = page.getViewport({ scale: 1.6 });
        const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
        await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
        blobs.push(await new Promise(r => c.toBlob(r, 'image/jpeg', 0.85)));
      }
      return blobsToText(blobs, name, log);
    }
    return text;
  }
  if (ext === 'docx') {
    await loadScript(CDN + 'mammoth@1.6.0/mammoth.browser.min.js');
    return (await mammoth.extractRawText({ arrayBuffer: await buf() })).value;
  }
  if (ext === 'pptx') {
    await loadScript(CDN + 'jszip@3.10.1/dist/jszip.min.js');
    const zip = await JSZip.loadAsync(await buf());
    const num = f => +f.match(/(\d+)\.xml$/)[1];
    const grab = async f => [...(await zip.file(f).async('string')).matchAll(/<a:t>([^<]*)<\/a:t>|<\/a:p>/g)].map(m => m[1] ?? '\n').join('').replace(/\n{2,}/g, '\n').trim();
    const slides = Object.keys(zip.files).filter(f => /^ppt\/slides\/slide\d+\.xml$/.test(f)).sort((a, b) => num(a) - num(b));
    const out = [];
    for (const f of slides) {
      let t = `[Slide ${num(f)}]\n` + await grab(f);
      const notes = `ppt/notesSlides/notesSlide${num(f)}.xml`;
      if (zip.file(notes)) { const n = await grab(notes); if (n.replace(/\d/g, '').trim()) t += `\n(Speaker notes: ${n})`; }
      out.push(t);
    }
    return out.join('\n\n').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&apos;/g, "'");
  }
  if (file.type.startsWith('image/')) return blobsToText([file], name, log);
  throw new Error(`${name}: this file type isn't supported yet. Use PDF, PowerPoint (.pptx), Word (.docx), text or photos.`);
}

const CHUNK = 60000;
async function saveSource(courseId, name, kind, text) {
  const base = uid(), parts = Math.max(1, Math.ceil(text.length / CHUNK));
  for (let i = 0; i < parts; i++) await Store.put('sources', `${base}-${i}`, { courseId, group: base, name, kind, part: i, parts, chars: text.length, text: text.slice(i * CHUNK, (i + 1) * CHUNK), at: Date.now() });
}
async function loadSources(courseId) {
  const rows = await Store.list('sources', 'courseId', courseId);
  const groups = {};
  for (const r of rows) (groups[r.group] ??= { group: r.group, name: r.name, kind: r.kind, chars: r.chars, at: r.at, parts: [] }).parts[r.part] = r;
  return Object.values(groups).map(g => ({ ...g, text: g.parts.map(p => p?.text || '').join(''), ids: g.parts.filter(Boolean).map(p => p.id) })).sort((a, b) => a.at - b.at);
}
function overviewText(sources, budget = 90000) {
  const mat = sources.filter(s => s.kind === 'material'); if (!mat.length) return '';
  const total = mat.reduce((n, s) => n + s.text.length, 0);
  return mat.map(s => {
    const share = Math.floor(budget * s.text.length / Math.max(total, budget));
    let t = s.text;
    if (t.length > share) { // evenly spaced slices so the whole book is represented
      const n = Math.max(4, Math.floor(share / 1500)), step = t.length / n;
      t = Array.from({ length: n }, (_, i) => t.slice(Math.floor(i * step), Math.floor(i * step) + Math.floor(share / n))).join('\n[…]\n');
    }
    return `=== ${s.name} ===\n${t}`;
  }).join('\n\n');
}
function relevantText(sources, words, budget = 22000) {
  const mat = sources.filter(s => s.kind === 'material'); if (!mat.length) return '';
  const keys = [...new Set(words.flatMap(w => String(w).toLowerCase().split(/[^\p{L}\p{N}]+/u)).filter(w => w.length > 3))];
  const blocks = [];
  for (const s of mat) { const t = s.text; for (let i = 0; i < t.length; i += 1200) blocks.push({ src: s.name, pos: i, text: t.slice(i, i + 1400) }); }
  for (const b of blocks) { const low = b.text.toLowerCase(); b.score = keys.reduce((n, k) => n + (low.split(k).length - 1) * (k.length > 6 ? 2 : 1), 0); }
  const picked = blocks.filter(b => b.score > 0).sort((a, b) => b.score - a.score).slice(0, Math.floor(budget / 1400));
  picked.sort((a, b) => a.src === b.src ? a.pos - b.pos : a.src.localeCompare(b.src));
  return picked.map(b => `--- from "${b.src}" ---\n${b.text}`).join('\n');
}
const examText = c => c.exam?.summary ? `Exam format (from the student's past paper): ${c.exam.summary}\nQuestion types: ${(c.exam.types || []).map(t => `${t.type} (${t.marks || '?'} marks; ${t.notes || ''})`).join('; ')}\nCommand words: ${(c.exam.commandWords || []).join(', ')}\nStyle notes: ${c.exam.styleNotes || ''}` : 'No past paper given: use a clear, standard exam style for this subject and level.';
const levelText = { new: 'completely new to this subject (start from the very basics)', some: 'knows a little, but treat gaps as likely and still start from the basics', revising: 'has studied this before and is revising for an exam (still teach in order from the basics, but more briskly)' };

Task: design an ordered learning path that takes this student from zero to exam-ready.

function allLessons(c) { return (c.path?.units || []).flatMap((u, ui) => u.lessons.map((l, li) => ({ ...l, unit: u, ui, li, last: li === u.lessons.length - 1 }))); }

async function genLesson(c, lesson, sources) {

Course: ${c.title}. Student: ${levelText[c.level]}.
${examText(c)}

${before}
THIS lesson: "${lesson.title}" (unit "${lesson.unit.title}"). Goal: ${lesson.goal}. Concepts: ${lesson.concepts.join('; ')}.

Return JSON: {"intro":"1-2 sentences","steps":[{"concept":"","learn":"2-5 short sentences; **bold** each new key term","type":"mcq|saq|essay","question":"","marks":1,"options":["","","",""],"answer":0,"why":["","","",""],"markScheme":[""],"modelAnswer":"","hint":"a nudge that does not give the answer away","fromSources":true}],"summary":["3-5 key takeaways"]}`, { tier: 'default', kind: 'lesson' });

function cleanSteps(res) {

}
function viewStep() {

  if (s.learn && run.mode === 'learn') learnBox.append(h('div', { class: 'learn' }, h('span', { class: 'eyebrow' }, 'Learn' + (s.extra ? ' · another way' : '')), md(s.learn),
    h('div', {}, h('button', { class: 'link small', onclick: async e => { const b = e.target; b.disabled = true; b.textContent = 'Explaining…';
      try { const t = await explainSimpler(c, s); b.replaceWith(h('div', { class: 'stack' }, h('span', { class: 'eyebrow' }, 'Simpler'), md(t))); } catch (er) { b.replaceWith(errorBox(er)); } } }, 'Explain it more simply'))));
  let picked = null, answerEl = null;
  const head = h('div', { class: 'row' }, h('span', { class: 'chip ' + s.type }, typeName[s.type]), h('span', { class: 'marks' }, `[${s.marks} mark${s.marks > 1 ? 's' : ''}]`),
    s.fromSources === false ? h('span', { class: 'chip ai', title: 'Not from your materials' }, 'AI-added') : null, s.extra ? h('span', { class: 'chip' }, 'Extra practice') : null);
  let input;

      h('span', { class: 'k' }, 'ABCD'[i]), h('span', {}, o))));
  } else {

  }

  const actions = h('div', { class: 'row' }, checkBtn, s.hint && run.mode === 'learn' ? h('button', { class: 'btn ghost', onclick: e => { e.target.remove(); hintBox.append(h('p', { class: 'small' }, h('b', {}, 'Hint: '), s.hint)); } }, 'Hint') : null,
    run.mode !== 'placement' ? h('button', { class: 'link small', onclick: () => { skipStep(); } }, 'Skip') : null);
  show(h('div', { class: 'stack' }, progressDots(run),
    h('div', { class: 'row' }, h('span', { class: 'eyebrow' }, `${run.lesson.title} · ${run.i + 1} of ${data.steps.length}`), h('span', { style: 'flex:1' }), h('button', { class: 'link small', onclick: viewCourse }, 'Leave lesson')),
    learnBox, h('div', { class: 'card' }, head, md(s.question).firstChild ? h('div', { class: 'q' }, md(s.question)) : null, input, hintBox, actions), fbBox));
  if (res) renderFeedback(res);

  async function check() {
    checkBtn.disabled = true;
    let r;
    if (s.type === 'mcq') {
      const right = picked === s.answer;
      r = { answer: s.options[picked], picked, score: right ? 1 : 0, verdict: right ? 'correct' : 'incorrect' };
    } else {
      const ans = answerEl.value.trim(); answerEl.readOnly = true;
      checkBtn.replaceChildren(h('span', { class: 'spin' }), ' Marking…');

    if (s.type === 'mcq') input.querySelectorAll('.opt').forEach((b, j) => { b.disabled = true; if (j === s.answer) b.classList.add('right'); else if (j === r.picked) b.classList.add('wrong');
      if (run.mode !== 'placement' && s.why?.[j] && (j === s.answer || j === r.picked)) b.lastChild.append(h('span', { class: 'why' }, s.why[j])); b.setAttribute('aria-pressed', String(j === r.picked)); });
    else { answerEl.value = r.answer; answerEl.readOnly = true; }
    const title = { correct: 'Correct', partial: 'Partly right', incorrect: 'Not quite' }[r.verdict];
    const fb = h('div', { class: 'fb ' + r.verdict }, h('h3', {}, title, h('span', { class: 'marks' }, `${r.score}/${s.marks}`)));
    if (run.mode !== 'placement') {
      if (r.feedback) fb.append(md(r.feedback));
      if (r.gotRight?.length) fb.append(h('div', {}, h('b', { class: 'small' }, 'You earned marks for'), h('ul', { class: 'small' }, r.gotRight.map(x => h('li', {}, x)))));
      if (r.missing?.length) fb.append(h('div', {}, h('b', { class: 'small' }, 'To get full marks, add'), h('ul', { class: 'small' }, r.missing.map(x => h('li', {}, x)))));
      if (r.misconception) fb.append(h('p', { class: 'small' }, h('b', {}, 'Watch out: '), r.misconception));
      const ans = r.betterAnswer || s.modelAnswer;

    }
    const flagOut = h('div');
    const next = h('div', { class: 'row' },
      h('button', { class: 'btn', onclick: () => { run.i++; viewStep(); } }, run.i + 1 < data.steps.length ? 'Next question' : 'Finish'),
      r.verdict !== 'correct' && run.mode === 'learn' && !run.data.steps[run.i + 1]?.extra ? h('button', { class: 'btn ghost', onclick: async e => { const b = e.target; b.disabled = true; b.textContent = 'Writing a new question…';
        try { const v = await variantStep(c, s, run.lesson); run.data.steps.splice(run.i + 1, 0, v); run.i++; viewStep(); } catch (er) { b.replaceWith(errorBox(er)); } } }, 'Practise this again') : null,
      run.mode !== 'placement' ? h('button', { class: 'link small', onclick: async e => { const b = e.target; b.disabled = true; b.textContent = 'Double-checking…';
        try { const d = await doubleCheck(c, s, s.type === 'mcq' ? null : r); r.flag = true; await record(run, s, r, true);
          let fix = '';
          if (Number.isInteger(d.fairScore) && d.fairScore !== r.score && s.type !== 'mcq') { r.score = Math.max(0, Math.min(s.marks, d.fairScore)); r.verdict = r.score >= s.marks ? 'correct' : r.score > 0 ? 'partial' : 'incorrect'; await record(run, s, r, true); fix = ` Your mark is now ${r.score}/${s.marks}.`; }
          b.replaceWith(h('div', { class: 'note' }, h('b', {}, d.ok ? 'Checked: this looks right. ' : 'Good catch. '), d.verdict, d.correction ? h('div', {}, h('b', {}, 'Correction: '), d.correction) : null, fix));
        } catch (er) { b.replaceWith(errorBox(er)); } } }, 'This looks wrong') : null);
    fbBox.replaceChildren(fb, next, flagOut);
  }
  async function skipStep() { run.results[run.i] = { answer: '', score: 0, verdict: 'incorrect', skipped: true }; await record(run, s, run.results[run.i]); run.i++; viewStep(); }
}
async function record(run, s, r, update) {
  if (run.mode === 'placement') return;
  const c = run.c; r.attemptId ||= uid();
  const a = { courseId: c.id, lessonId: run.lesson.id, lessonTitle: run.lesson.title, concept: s.concept || run.lesson.title, type: s.type, question: s.question.slice(0, 500), answer: (r.answer || '').slice(0, 4000), score: r.score, marks: s.marks, verdict: r.verdict, misconception: r.misconception || '', flag: !!r.flag, at: Date.now() };

  try { await Store.put('attempts', r.attemptId, a); if (!update) await saveCourse(c); } catch (e) { console.warn('save failed', e); }
}
async function viewDone() {

  if (run.mode === 'placement') {
    const skipped = await finishPlacement(run);
    show(h('div', { class: 'stack' }, h('h1', {}, 'Placement done'), h('p', {}, skipped ? `You can skip ${skipped} lesson${skipped > 1 ? 's' : ''} you already know. They’re marked blue on your path and you can open them any time.` : 'Starting from the beginning is the right call. Your path is ready.'),
      h('div', { class: 'row' }, h('button', { class: 'btn mark', onclick: () => openCourse(c) }, 'Go to my path'))));
    return;
  }
  if (run.mode === 'learn') { (c.progress ??= {})[run.lesson.id] = { done: true, pct: p, at: Date.now() }; await saveCourse(c); if (!c.example) await refreshCourses(); }
  const weak = data.steps.filter((s, i) => run.results[i]?.verdict !== 'correct').map(s => s.concept).filter((v, i, a) => v && a.indexOf(v) === i);
  const nx = nextLesson(c);
  show(h('div', { class: 'stack' }, progressDots(run), h('span', { class: 'eyebrow' }, run.mode === 'exam' ? 'Practice exam finished' : 'Lesson finished'), h('h1', {}, run.lesson.title),
    h('div', { class: 'row' }, h('span', { class: 'score-big' }, p + '%'), h('span', { class: 'marks' }, `${got}/${of} marks`)),
    h('p', {}, p >= 85 ? 'Strong work. You’ve got this.' : p >= 70 ? 'Good. A quick review of the points below will lock it in.' : p >= 40 ? 'You’re getting there. Go over the concepts below, then try the lesson again or move on carefully.' : 'This one needs another go. That’s normal at the start: try it again and use the hints.'),
    data.summary?.length ? h('div', { class: 'card' }, h('h3', {}, 'Key takeaways'), h('ul', {}, data.summary.map(x => h('li', { html: inline(x) })))) : null,
    weak.length ? h('div', { class: 'card' }, h('h3', {}, 'Review these'), h('ul', {}, weak.map(x => h('li', {}, x)))) : null,
    h('div', { class: 'row' },
      nx && run.mode === 'learn' ? h('button', { class: 'btn mark', onclick: () => startLesson(c, nx) }, 'Next lesson: ' + nx.title) : null,
      run.mode === 'learn' ? h('button', { class: 'btn ghost', onclick: () => { S.run.i = -1; S.run.results = []; S.run.data.steps = S.run.data.steps.filter(s => !s.extra); viewStep(); } }, 'Redo this lesson') : null,
      h('button', { class: 'btn ghost', onclick: () => openCourse(c) }, 'Back to path'))));
}

function viewSignIn() {
  S.view = 'signin'; crumb('');
  const agree = h('input', { type: 'checkbox', id: 'agree' });
  const msg = h('p', { class: 'err', role: 'alert', hidden: true });
  const btn = h('button', { class: 'btn mark', disabled: true, onclick: async () => {
    btn.disabled = true; btn.textContent = 'Opening Google…';
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
    if (error) { msg.hidden = false; msg.textContent = 'Google sign-in did not start. Try again.'; btn.disabled = false; btn.textContent = 'Continue with Google'; }
  } }, 'Continue with Google');
  agree.addEventListener('change', () => { btn.disabled = !agree.checked; });

    h('section', { class: 'hero' },
      h('div', { class: 'stack' },
        h('span', { class: 'eyebrow' }, 'Learn it, then use it'),
        h('h1', {}, 'Learn any subject one rung at a time, through the questions your exam will ask.'),
        h('p', { class: 'muted' }, 'Upload your books, slides and notes. Add a past paper if you have one. Study Ladder starts you from the very basics and teaches each idea with a short note and a question in the exam’s own style, then marks your answer and tells you what to fix.')),

    h('div', { class: 'card', style: 'max-width:460px' },

      h('p', { class: 'small muted' }, 'You get your own private workspace. Your courses, materials and answers are only visible to you.'),
      h('label', { class: 'row small', for: 'agree', style: 'flex-wrap:nowrap;align-items:flex-start' }, agree, h('span', {}, 'I’m 13 or older, or I have permission from a parent or guardian.')),
      h('div', {}, btn), msg));
}
$('#homeBtn').addEventListener('click', async () => { if (!Store.uid) return; await refreshCourses().catch(() => {}); viewHome(); });
$('#signOut').addEventListener('click', async () => { await sb.auth.signOut(); location.reload(); });
(async function boot() {
  try {
    const cfg = await (await fetch('/api/config')).json();
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) throw new Error('not configured');
    sb = supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
  } catch (e) {
    show(h('div', { class: 'card empty' }, h('p', {}, 'Study Ladder isn’t set up yet. The site owner needs to add the Supabase settings.'))); return;
  }
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return viewSignIn();
  await Store.init(session.user);
  $('#storeBadge').textContent = Store.name; $('#signOut').hidden = false;
  try { await refreshCourses(); } catch (e) { console.warn(e); }
  viewHome();
})();
